<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#050811"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="cyberGreen" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient><linearGradient id="threatRed" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#f43f5e"/><stop offset="100%" stop-color="#fb7185"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".75"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".85"/></linearGradient><filter id="glow-cyan" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="glow-red" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes pulseRing{0%{r:20px;opacity:.8}50%{opacity:.4}}@keyframes blinkBeacon{0%{opacity:.3;transform:scale(.95)}}@keyframes floatNode{0%{transform:translateY(0)}}.pulse-ring,.radar-sweep{transform-origin:1040px 180px}.radar-sweep{animation:rotateRadar 8s linear infinite}.pulse-ring{animation:pulseRing 3s ease-out infinite}.pulse-beacon{animation:blinkBeacon 2s ease-in-out infinite alternate}.threat-node{animation:floatNode 4s ease-in-out infinite alternate}.grid-lines{stroke:#334155;stroke-opacity:.25;stroke-dasharray:4 4}.cyber-pill{transition:all .3s ease}</style></defs><